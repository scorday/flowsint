name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: none
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 -u neo4j -p test-only 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Same entrypoint as local development — keeps CI and `make test` in sync.
      - name: Run tests
        run: make test
        env:
          # flowsint_core hard-requires these at import time (provided by .env
          # locally). Dummy values — no service is reached during tests:
          # connections (redis.from_url, create_engine) are lazy.
          AUTH_SECRET: ci-only-dummy-secret
          REDIS_URL: redis://127.0.0.1:6379/0
          FLOWSINT_TEST_NEO4J_URI: bolt://127.0.0.1:17687

  frontend-test:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
      - run: yarn workspace flowsint-app test
